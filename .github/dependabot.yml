version: 2

# energy-cost is a library: its ranges in pyproject.toml say what it supports, and uv.lock only makes development and
# CI reproducible. The lock moves all at once, indirect dependencies included, through the monthly `upgrade` workflow,
# so Dependabot only opens security updates for it - a limit of 0 turns its version updates off, not its security
# updates. Actions have no other way to stay current, so they get monthly version updates.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    versioning-strategy: lockfile-only
    labels:
      - dependencies
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
